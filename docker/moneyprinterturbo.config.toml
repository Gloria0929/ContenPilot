# MoneyPrinterTurbo API 的最小持久化配置。
# 在线素材生成前，请至少配置一个素材源的 API Key。

log_level = "INFO"
listen_host = "0.0.0.0"
listen_port = 8081

[app]
# API 监听所有网卡并映射到宿主机 8081；如需跨可信局域网访问，建议配置 api_key。
api_key = ""
max_concurrent_tasks = 2
max_queued_tasks = 20

# MoneyPrinterTurbo 自己的脚本/关键词生成引擎。
# Ollama 不需要 API Key，但必须显式指定 Provider 和已安装的模型。
llm_provider = "ollama"
ollama_base_url = "http://192.168.3.119:11434/v1"
ollama_model_name = "qwen3.8:latest"

# 默认使用 Pexels 素材。填入 Key 后再提交正式视频任务。
video_source = "pexels"
pexels_api_keys = []
pixabay_api_keys = []
coverr_api_keys = []
